name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Build macOS app
        run: bun run tauri build --target universal-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 7

      - name: Attach DMG to tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -gt 0 || (echo "Nenhum DMG foi gerado" && exit 1)

          for attempt in {1..60}; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "${dmgs[@]}" --clobber
              exit 0
            fi
            echo "A release ${{ github.ref_name }} ainda não está disponível (tentativa $attempt/60)."
            sleep 10
          done

          echo "A release ${{ github.ref_name }} não foi criada a tempo."
          exit 1
