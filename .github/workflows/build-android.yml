name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/sync-version.mjs "${{ github.ref_name }}"

      - name: Initialize Android project
        run: bun run tauri:android:init

      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/chef-gestao-release.jks
        run: |
          test -n "$ANDROID_KEY_BASE64" || (echo "Secret ANDROID_KEY_BASE64 não configurado" && exit 1)
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          bun scripts/configure-android-signing.mjs

      - name: Build APK
        run: bun run tauri:android:apk

      - name: Validate APK signature
        run: |
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#apks[@]}" -gt 0 || (echo "Nenhum APK foi gerado" && exit 1)
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chef-gestao-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APKs to tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          test "${#apks[@]}" -gt 0 || (echo "Nenhum APK foi gerado" && exit 1)

          for attempt in {1..60}; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "${apks[@]}" --clobber
              exit 0
            fi
            echo "A release ${{ github.ref_name }} ainda não está disponível (tentativa $attempt/60)."
            sleep 10
          done

          echo "A release ${{ github.ref_name }} não foi criada a tempo."
          exit 1
