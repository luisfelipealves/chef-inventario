name: Build Windows Installer

on:
  push:
    branches:
      - main
      - "release-*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Corre em todos os pushes e PRs, e barra o build: uma tag não consegue
  # publicar uma release sem passar por tipos, lint e testes.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

  build:
    needs: verify
    # Só empacota em tags (ou a pedido) — pushes e PRs ficam-se pela verify.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ChefGestão v__VERSION__"
          releaseBody: "Instalador Windows para ChefGestão."
          releaseDraft: true
          prerelease: false

      - name: Build MSIX package (Microsoft Store)
        run: bun run tauri:windows:build --arch x64 --runner bun

      - name: Attach MSIX to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/msix -Recurse -Include *.msix, *.msixbundle | ForEach-Object { $_.FullName }
          gh release upload "${{ github.ref_name }}" @files --clobber

      # Substitui o corpo por omissão pelas notas do CHANGELOG. Sem secção para
      # a tag, avisa e segue — não vale a pena falhar um build já feito só por
      # causa das notas, que se podem corrigir no rascunho.
      - name: Publish release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Sem notas para ${{ github.ref_name }} — mantém o corpo por omissão."
            exit 0
          }
          gh release edit "${{ github.ref_name }}" --notes-file release-notes.md

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            src-tauri/target/msix/*.msix
            src-tauri/target/msix/*.msixbundle
          retention-days: 7
