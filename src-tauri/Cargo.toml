[package]
name = "chef-gestao"
version = "1.1.0"
description = "ChefGestão — Gestão de stock e fichas técnicas"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chef_gestao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chef-gestao"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
